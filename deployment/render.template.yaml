# Review template only. Do not apply, create or resume a service yet.
# Existing Render service stays suspended and auto-deploy stays off.
services:
  - type: web
    name: agentcosign-paypal-p0
    runtime: docker
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    plan: 1c-2g # Existing service compute size; verify before applying.
    numInstances: 1
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    disk:
      name: judge-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://agentcosign-paypal-p0.onrender.com
      - key: PORT
        value: "10000"
      - key: MAX_LIVE_RUNS
        value: "40"
      - key: MAX_ACTIVE_SESSIONS
        value: "200"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
# No PAYPAL_CONFIG. Never copy historical stores or credentials into this image.
# MAX_LIVE_RUNS is a cumulative per-kind application limit, not a billing cap.
# Reviewed replay bundle must be explicitly approved for publication before Git deployment.
